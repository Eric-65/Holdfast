name: Test & build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_NIMIQ_RPC_URL: ${{ vars.VITE_NIMIQ_RPC_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # The live app is hosted on Vercel. Publishing to GitHub Pages as well is opt-in:
    # set the repository variable DEPLOY_TO_PAGES to "true" and enable Pages.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
