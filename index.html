<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fa" />
    <meta name="description" content="Holdfast Savings: Save it. Stake it. Hold fast. Non-custodial savings goals for Nimiq Pay: lock NIM by staking, a friend keeps you honest." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Holdfast Savings</title>
    <!-- Link previews (WhatsApp, X, Telegram, Slack...). Preview crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holdfast Savings" />
    <meta property="og:title" content="Holdfast Savings: Save it. Stake it. Hold fast." />
    <meta property="og:description" content="Savings goals that earn staking rewards in your own Nimiq Pay wallet, with a friend keeping you on track." />
    <meta property="og:url" content="https://holdfast-puce.vercel.app/" />
    <meta property="og:image" content="https://holdfast-puce.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Holdfast Savings: a savings goal with a progress ring, locked by staking NIM in Nimiq Pay." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Holdfast Savings: Save it. Stake it. Hold fast." />
    <meta name="twitter:description" content="Savings goals that earn staking rewards in your own Nimiq Pay wallet, with a friend keeping you on track." />
    <meta name="twitter:image" content="https://holdfast-puce.vercel.app/og-image.png" />
    <script>
      // Set the theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('holdfast.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Holdfast needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
